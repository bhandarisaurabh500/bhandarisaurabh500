<svg width="1180" height="360" viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes floatOrbs {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.55; }
      }
      .anim-glow { animation: pulseGlow 5s ease-in-out infinite; }
      .anim-float { animation: floatOrbs 7s ease-in-out infinite; }
    </style>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D070B"/>
      <stop offset="100%" stop-color="#170B13"/>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1180" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1180" height="360" rx="18" fill="none" stroke="#3D1222" stroke-width="1.2"/>

  <!-- Ambient Cinematic Glows -->
  <circle cx="1020" cy="120" r="140" fill="#701A3D" opacity="0.25" filter="url(#softBlur)" class="anim-glow"/>
  <circle cx="120" cy="300" r="130" fill="#701A3D" opacity="0.20" filter="url(#softBlur)" class="anim-glow"/>

  <!-- Top Technical Chrome Bar -->
  <rect x="50" y="36" width="1080" height="36" rx="8" fill="#170B13" stroke="#2A0B17" stroke-width="1"/>
  <circle cx="72" cy="54" r="4.5" fill="#701A3D"/>
  <circle cx="86" cy="54" r="4.5" fill="#451126"/>
  <circle cx="100" cy="54" r="4.5" fill="#C77B9B"/>
  
  <text x="590" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600"
        letter-spacing="1" fill="#A06D83">saurabh-bhandari // enterprise-software-engineer</text>

  <rect x="965" y="43" width="145" height="22" rx="11" fill="#701A3D" fill-opacity="0.35" stroke="#C77B9B" stroke-width="1"/>
  <circle cx="978" cy="54" r="3" fill="#C77B9B"/>
  <text x="987" y="57" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700"
        fill="#FBF5F7">OPEN FOR WORK</text>

  <!-- Main Left Hero: Clear Identity -->
  <g transform="translate(60, 0)">
    <!-- Category Pill / Identity Tagline -->
    <text x="0" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700"
          letter-spacing="2" fill="#C77B9B">FULL STACK SOFTWARE ENGINEER</text>

    <!-- Name Heading -->
    <text x="0" y="172" font-family="'Inter', -apple-system, sans-serif" font-size="46" font-weight="800"
          letter-spacing="-0.8" fill="#FBF5F7">Saurabh Bhandari</text>

    <!-- Clear What We Build Proposition -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="600"
          fill="#E8B9CB">Building Production Web Platforms &amp; Mobile Applications</text>

    <text x="0" y="238" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="400"
          fill="#A06D83">Specialized in Java/Spring Boot microservices, high-performance React frontends, and native Android apps.</text>
  </g>

  <!-- Right: 2 Distinct Pillars (Web Engineering & Mobile Engineering) -->
  <g transform="translate(730, 102)">
    <!-- Pillar 1: Web Applications -->
    <rect x="0" y="0" width="390" height="96" rx="12" fill="#170B13" stroke="#2A0B17" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#C77B9B"/>
    <text x="20" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#C77B9B">🌐 WEB ENGINEERING &amp; APIS</text>
    <text x="20" y="50" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FBF5F7">Java • Spring Boot • React.js • Node.js</text>
    <text x="20" y="74" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#A06D83">Enterprise REST APIs, MySQL, PostgreSQL, Supabase</text>

    <!-- Pillar 2: Mobile Applications -->
    <rect x="0" y="112" width="390" height="96" rx="12" fill="#170B13" stroke="#2A0B17" stroke-width="1.2"/>
    <rect x="0" y="112" width="4" height="96" rx="2" fill="#701A3D"/>
    <text x="20" y="140" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#C77B9B">📱 MOBILE APP DEVELOPMENT</text>
    <text x="20" y="162" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FBF5F7">Kotlin • Android SDK • React Native</text>
    <text x="20" y="186" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#A06D83">Cross-platform architectures &amp; native performance</text>
  </g>

  <!-- Bottom Location & Education Strip -->
  <g transform="translate(60, 310)">
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#A06D83">
      🎓 M.Sc Computer Science &nbsp;•&nbsp; 📍 Ahilyanagar, Maharashtra, India &nbsp;•&nbsp; ⚡ Building • Learning • Shipping
    </text>
  </g>
</svg>